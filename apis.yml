name: Europass
description: >-
  EuroPass is a Paris-based digital agency founded in 2016 that specializes in
  Chinese outbound tourism, describing itself as the European leader in
  implementing Chinese digital solutions for destinations, retailers,
  transportation, attractions, and hospitality brands. Its services span Chinese
  social-media management (notably WeChat and Weibo), WeChat mini-programs and
  stores, e-commerce, digital ticketing, destination marketing, and mobile
  payment acceptance via WeChat Pay and Alipay so European businesses can serve
  and transact with Chinese travelers. EuroPass operates as a services and
  marketing company rather than a developer platform: it publishes no public
  API, developer portal, SDKs, or technical documentation. This profile was
  surfaced as a portfolio company of Partech and enriched with the identity and
  domain-security data available from its public web presence.
